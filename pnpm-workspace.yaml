allowBuilds:
  esbuild: true
  lefthook: true

engineStrict: true

minimumReleaseAgeExclude:
  - '@spellbookx/recipes'
  - eslint-plugin-spellbookx
  - eslint-plugin-vuoto
  - vuoto
  - commitlint-config-spellbookx
  - cspell-config-spellbookx
  - prettier-config-spellbookx
  - cz-config-spellbookx@2.1.3

publicHoistPattern:
  - '*prettier-plugin-*'
  - '@prettier/plugin-*'
