name: 🐛 Bug Report
description: Create a report to help us fix a bug or unexpected behavior in relsx
title: 'fix: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue! Please fill in the details below to help us understand and resolve the problem.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem you encountered...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What steps did you take before encountering the issue?
      placeholder: |
        1. Run `relsx --dry-run`
        2. Inspect output...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior & Error Output
      description: Include terminal logs, error messages, or stack traces.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: package-manager
    attributes:
      label: Package Manager
      description: Which package manager are you using?
      options:
        - pnpm
        - npm
        - yarn
        - bun
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Output of `node -v`
      placeholder: e.g. v22.11.0
    validations:
      required: true
  - type: input
    id: relsx-version
    attributes:
      label: relsx Version
      description: Output of `relsx --version`
      placeholder: e.g. 0.0.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: Your OS and architecture
      placeholder: e.g. Linux Ubuntu 24.04 / macOS Sequoia / Windows 11
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have verified that this issue is not already reported.
          required: true
        - label: I have tested with `--dry-run` where applicable.
          required: false
