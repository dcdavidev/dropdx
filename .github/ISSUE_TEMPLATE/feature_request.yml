name: ✨ Feature Request
description: Suggest an idea, enhancement, or new feature for relsx
title: 'feat: '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature for relsx! Please describe your proposal clearly below.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific workflow problem or limitation?
      placeholder: I am trying to... but currently...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution & CLI Design
      description: Describe the solution you would like, including proposed CLI flags or configuration syntax.
      placeholder: Add a `--my-option` flag that...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
      placeholder: An alternative approach could be...
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples here.
